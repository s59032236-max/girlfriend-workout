<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fff5f7">
<title>寶寶運動日記 💕</title>
<style>
:root{--pink:#ff7f9f;--pink2:#ffd9e3;--cream:#fffaf5;--text:#493c42;--muted:#9b8d93;--card:#fff;--green:#82c9a7;--shadow:0 10px 30px rgba(92,55,67,.09)}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(145deg,#fff5f7,#fffaf4);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:var(--text)}
.app{max-width:520px;margin:auto;min-height:100vh;padding:18px 16px 100px}.top{display:flex;justify-content:space-between;align-items:center;margin:6px 2px 18px}.title{font-size:25px;font-weight:800}.subtitle{font-size:13px;color:var(--muted);margin-top:3px}.gear{border:0;background:#fff;border-radius:50%;width:42px;height:42px;font-size:20px;box-shadow:var(--shadow)}
.card{background:rgba(255,255,255,.88);border-radius:24px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.hero{text-align:center;padding:24px 18px;background:linear-gradient(145deg,#fff,#fff0f4)}
.heart{font-size:55px;display:block;animation:beat 1.7s infinite}@keyframes beat{50%{transform:scale(1.08)}}
.hero h2{margin:8px 0 4px;font-size:22px}.hero p{margin:0;color:var(--muted);font-size:14px}
.complete{margin-top:18px;width:100%;border:0;border-radius:18px;padding:16px;background:var(--pink);color:white;font-size:17px;font-weight:800;box-shadow:0 8px 18px rgba(255,127,159,.3)}
.complete:active{transform:scale(.98)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{text-align:center;background:#fff;border-radius:18px;padding:15px 7px}.num{font-size:22px;font-weight:800}.label{font-size:12px;color:var(--muted);margin-top:4px}
h3{margin:2px 0 13px;font-size:17px}.calendar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.month{font-weight:800}.arrow{border:0;background:#fff1f4;border-radius:10px;padding:7px 10px;color:var(--pink);font-weight:bold}
.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}.week{font-size:11px;color:var(--muted);margin-bottom:7px}.day{aspect-ratio:1;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:13px;background:#fff7f8;position:relative}.day.done{background:var(--pink2);font-weight:800;color:#c64e70}.day.done:after{content:"♥";position:absolute;font-size:8px;bottom:3px}.day.today{outline:2px solid var(--pink)}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field select{width:100%;border:1px solid #f0e1e5;border-radius:13px;padding:11px;background:#fff;font-size:14px;color:var(--text)}
.save{width:100%;margin-top:12px;border:0;border-radius:14px;padding:13px;background:#fff0f4;color:#d45c7b;font-weight:800}
.reward{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #f3e9ec}.reward:last-child{border:0}.badge{background:#fff0f4;color:#d45c7b;padding:6px 9px;border-radius:10px;font-size:12px;font-weight:800}
.log{max-height:240px;overflow:auto}.logitem{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #f3e9ec;font-size:13px}.logitem:last-child{border:0}.empty{text-align:center;color:var(--muted);padding:20px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.92);backdrop-filter:blur(12px);display:flex;justify-content:space-around;border-top:1px solid #f4e6e9}nav button{border:0;background:none;color:var(--muted);font-size:11px}nav span{display:block;font-size:20px;margin-bottom:2px}
.modal{display:none;position:fixed;inset:0;background:rgba(55,35,42,.28);z-index:5;padding:30px 16px}.modal.show{display:block}.modalbox{max-width:490px;margin:50px auto;background:#fff;border-radius:24px;padding:20px}.close{float:right;border:0;background:#f8eef1;border-radius:50%;width:32px;height:32px}.toast{position:fixed;left:50%;bottom:85px;transform:translate(-50%,20px);opacity:0;background:#493c42;color:#fff;padding:12px 17px;border-radius:14px;font-size:13px;transition:.25s;z-index:10}.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div><div class="title">🌷 寶寶運動日記</div><div class="subtitle">今天也要為自己努力一下！</div></div><button class="gear" onclick="openSettings()">⚙️</button></div>

  <section class="card hero">
    <span class="heart">💗</span><h2 id="greeting">今天運動了嗎？</h2><p id="heroText">完成運動後，記得來打卡喔！</p>
    <button class="complete" onclick="quickComplete()">我完成運動了！ ✓</button>
  </section>

  <section class="stats">
    <div class="stat"><div class="num" id="streak">0</div><div class="label">🔥 連續天數</div></div>
    <div class="stat"><div class="num" id="monthCount">0</div><div class="label">🏃‍♀️ 本月次數</div></div>
    <div class="stat"><div class="num" id="points">0</div><div class="label">⭐ 點數</div></div>
  </section>

  <section class="card" style="margin-top:14px">
    <div class="calendar-head"><button class="arrow" onclick="changeMonth(-1)">‹</button><div class="month" id="monthTitle"></div><button class="arrow" onclick="changeMonth(1)">›</button></div>
    <div class="week"><b>日</b><b>一</b><b>二</b><b>三</b><b>四</b><b>五</b><b>六</b></div>
    <div class="days" id="calendar"></div>
  </section>

  <section class="card">
    <h3>🏃‍♀️ 記錄運動</h3>
    <div class="formgrid">
      <div class="field"><label>運動類型</label><select id="type"><option>跑步</option><option>健身</option><option>瑜伽</option><option>走路</option><option>球類</option><option>其他</option></select></div>
      <div class="field"><label>運動分鐘</label><input id="minutes" type="number" min="1" placeholder="30"></div>
    </div>
    <button class="save" onclick="addWorkout()">＋ 新增一筆運動</button>
  </section>

  <section class="card">
    <h3>🎁 愛的獎勵</h3>
    <div id="rewards"></div>
  </section>

  <section class="card">
    <h3>📋 最近紀錄</h3><div class="log" id="log"></div>
  </section>
</div>

<nav><button onclick="scrollTop()"><span>🏠</span>首頁</button><button onclick="document.querySelector('.card:nth-of-type(3)').scrollIntoView({behavior:'smooth'})"><span>📅</span>月曆</button><button onclick="document.querySelector('.card:nth-of-type(4)').scrollIntoView({behavior:'smooth'})"><span>🏃</span>運動</button><button onclick="openSettings()"><span>⚙️</span>設定</button></nav>
<div class="toast" id="toast"></div>

<div class="modal" id="settings">
 <div class="modalbox">
  <button class="close" onclick="closeSettings()">×</button><h3>⚙️ 小小設定</h3>
  <div class="field"><label>女朋友暱稱</label><input id="nickname" placeholder="例如：寶寶"></div>
  <div style="height:10px"></div>
  <div class="field"><label>每次完成獲得點數</label><input id="pointValue" type="number" min="1"></div>
  <button class="save" onclick="saveSettings()">儲存設定</button>
 </div>
</div>

<script>
const KEY='girlfriendWorkoutV1';
let data=JSON.parse(localStorage.getItem(KEY)||'null')||{logs:[],nickname:'寶寶',pointValue:10,rewards:[{p:50,t:'請喝飲料 🧋'},{p:100,t:'吃一頓大餐 🍰'},{p:200,t:'約會一次 💕'},{p:500,t:'神秘大獎 🎁'}]};
let view=new Date(); view.setDate(1);
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function dateKey(d){return d.toISOString().slice(0,10)}
function todayKey(){let d=new Date();return dateKey(new Date(d.getFullYear(),d.getMonth(),d.getDate()))}
function quickComplete(){let k=todayKey(); if(data.logs.some(x=>x.date===k)){toast('今天已經打卡過囉 💕');return} data.logs.push({date:k,type:'自由運動',minutes:0,points:data.pointValue,time:Date.now()});save();toast('🎉 太棒了！今天完成運動 +'+data.pointValue+' 點！')}
function addWorkout(){let m=parseInt(document.getElementById('minutes').value);if(!m||m<1){toast('請輸入運動分鐘數喔！');return}let k=todayKey();data.logs.push({date:k,type:document.getElementById('type').value,minutes:m,points:data.pointValue,time:Date.now()});save();document.getElementById('minutes').value='';toast('💗 運動紀錄已保存！ +'+data.pointValue+' 點')}
function getDates(){return [...new Set(data.logs.map(x=>x.date))]}
function streak(){let s=0,d=new Date();d.setHours(0,0,0,0);while(getDates().includes(dateKey(d))){s++;d.setDate(d.getDate()-1)}return s}
function render(){document.getElementById('greeting').textContent=(data.nickname||'寶寶')+'，今天運動了嗎？';document.getElementById('heroText').textContent=getDates().includes(todayKey())?'今天完成啦！妳真的很棒 💕':'完成運動後，記得來打卡喔！';document.getElementById('streak').textContent=streak();let now=new Date();document.getElementById('monthCount').textContent=data.logs.filter(x=>x.date.startsWith(now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0'))).length;document.getElementById('points').textContent=data.logs.reduce((a,x)=>a+x.points,0);renderCal();renderRewards();renderLog()}
function renderCal(){let y=view.getFullYear(),m=view.getMonth();document.getElementById('monthTitle').textContent=y+' 年 '+(m+1)+' 月';let first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),el=document.getElementById('calendar');el.innerHTML='';for(let i=0;i<first;i++)el.appendChild(document.createElement('div'));for(let d=1;d<=days;d++){let e=document.createElement('div');e.className='day';let k=dateKey(new Date(y,m,d));if(getDates().includes(k))e.classList.add('done');if(k===todayKey())e.classList.add('today');e.textContent=d;el.appendChild(e)}}
function renderRewards(){let pts=data.logs.reduce((a,x)=>a+x.points,0),el=document.getElementById('rewards');el.innerHTML=data.rewards.map(r=>`<div class="reward"><span>${r.t}</span><span class="badge">${r.p} ⭐ ${pts>=r.p?'✓':'未達成'}</span></div>`).join('')}
function renderLog(){let el=document.getElementById('log'),arr=[...data.logs].sort((a,b)=>b.time-a.time).slice(0,20);if(!arr.length){el.innerHTML='<div class="empty">還沒有紀錄，開始第一次打卡吧 💕</div>';return}el.innerHTML=arr.map(x=>`<div class="logitem"><span>${x.date}　${x.type}${x.minutes?' · '+x.minutes+' 分鐘':''}</span><b>+${x.points}⭐</b></div>`).join('')}
function changeMonth(n){view.setMonth(view.getMonth()+n);renderCal()}
function openSettings(){document.getElementById('nickname').value=data.nickname;document.getElementById('pointValue').value=data.pointValue;document.getElementById('settings').classList.add('show')}
function closeSettings(){document.getElementById('settings').classList.remove('show')}
function saveSettings(){data.nickname=document.getElementById('nickname').value.trim()||'寶寶';data.pointValue=Math.max(1,parseInt(document.getElementById('pointValue').value)||10);save();closeSettings();toast('設定已保存 💕')}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
function scrollTop(){window.scrollTo({top:0,behavior:'smooth'})}
render();
</script>
</body>
</html>
